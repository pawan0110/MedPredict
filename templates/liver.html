<!DOCTYPE html>
<html>

<head>
    <title>Liver Disease Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <a href="/chatbot" class="chat-help">Need Help?</a>
    <a href="/" class="back-home">← Back to Home</a>

    <div class="container">
        <h2>Liver Disease Risk Prediction</h2>

        <form action="/predict_liver" method="post">

            <div class="form-grid">

                <div class="form-group">

                    <label>Age:</label>
                    <input type="number" name="age" required><br><br>

                    <label>Gender:</label>
                    <select name="gender" required>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select><br><br>

                    <label>Total Bilirubin:</label>
                    <input type="number" step="0.01" name="total_bilirubin" required><br><br>

                    <label>Direct Bilirubin:</label>
                    <input type="number" step="0.01" name="direct_bilirubin" required><br><br>

                    <label>Alkaline Phosphotase:</label>
                    <input type="number" step="0.01" name="alkphos" required><br><br>

                    <label>SGPT (Alanine Aminotransferase):</label>
                    <input type="number" step="0.01" name="sgpt" required><br><br>

                    <label>SGOT (Aspartate Aminotransferase):</label>
                    <input type="number" step="0.01" name="sgot" required><br><br>

                    <label>Total Proteins:</label>
                    <input type="number" step="0.01" name="total_proteins" required><br><br>

                    <label>Albumin:</label>
                    <input type="number" step="0.01" name="albumin" required><br><br>

                    <label>A/G Ratio:</label>
                    <input type="number" step="0.01" name="ag_ratio" required><br><br>

                </div>

            </div>

            <br>

            <div style="text-align:center;">
                <button type="submit">Predict</button>
            </div>

        </form>
    </div>

</body>

</html>
